#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
# Base is qodana.recommended, JetBrains' own bundled profile (pulled from qodana.jar inside
# the pinned linter image to confirm this, not guessed). It already excludes GLOBAL
# inspections wholesale ("significant time consumption" per their own comment) - which
# covers "unused", SameReturnValue and UnnecessaryModuleDependencyInspection, all found to
# be structurally false-positive here: qodana-jvm-community lacks IntelliJ Ultimate's Spring
# plugin, so whole-program reachability analysis has no entry-point awareness for
# @Component/@Service/@Repository/@Controller beans (container-instantiated via reflection).
# It also drops HTML/XML/JSON/Maven from its category allow-list, which incidentally also
# kills the Thymeleaf th:* HtmlUnknownAttribute noise and the Maven "dependency/plugin not
# found" false positives (CI's linter can't resolve freshly-bumped versions like
# telegrambots-client:10.2.1 against Maven Central - the deps are real, the merged Renovate
# PRs prove it).
profile:
  base:
    name: qodana.recommended

projectJDK: "25" #(Applied in CI/CD pipeline)
# Pinned (not :latest) for CI reproducibility - bump periodically; 2025.3 was two release
# cycles stale when last checked (current is 2026.2).
linter: jetbrains/qodana-jvm-community:2026.2
