#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
# Base is the empty profile (nothing enabled by default), then only the categories relevant
# to this Java/Spring/Maven codebase are turned on - codesweeper only fixes Java/pom.xml/Spring
# config findings, so HTML/YAML/etc. inspections (e.g. HtmlUnknownAttribute on Thymeleaf th:*
# attributes) just generated noise the fixer couldn't act on safely. Security is generic
# (hardcoded passwords, vulnerable Maven dependencies) but low-noise and worth keeping.
profile:
  base:
    name: empty
  groups:
    - groupId: RelevantInspections
      groups:
        - "category:Java"
        - "category:Maven"
        - "category:Spring"
        - "category:Security"
  inspections:
    - group: RelevantInspections
      enabled: true

projectJDK: "25" #(Applied in CI/CD pipeline)
# Pinned (not :latest) for CI reproducibility - bump periodically; 2025.3 was two release
# cycles stale when last checked (current is 2026.2).
linter: jetbrains/qodana-jvm-community:2026.2
