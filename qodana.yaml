#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify inspection profile for code analysis
# Default = IDE's Project Default profile, the broadest built-in coverage (far more than
# qodana.starter/qodana.recommended) - used to feed codesweeper a richer set of findings.
profile:
  name: Default

projectJDK: "25" #(Applied in CI/CD pipeline)
# Pinned (not :latest) for CI reproducibility - bump periodically; 2025.3 was two release
# cycles stale when last checked (current is 2026.2).
linter: jetbrains/qodana-jvm-community:2026.2
