<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${note.id == null} ? 'Neue Notiz' : 'Notiz bearbeiten'"></title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="/css/notes.css"/>
</head>
<body>
<div class="container">
  <header>
    <h1 th:text="${note.id == null} ? 'Neue Notiz' : 'Notiz bearbeiten'"></h1>
  </header>

  <main>
    <form th:action="${note.id == null} ? '/notes' : '/notes/' + ${note.id}" method="post">

      <div class="form-group">
        <label for="title">Titel *</label>
        <input type="text" id="title" name="title" th:value="${note.title}"
               placeholder="Titel der Notiz" required/>
      </div>

      <div class="form-group">
        <label for="content">Inhalt</label>
        <textarea id="content" name="content" rows="10"
                  placeholder="Notizinhalt..." th:text="${note.content}"></textarea>
        <div style="margin-top:4px;">
          <button type="button" id="expand-btn" class="btn btn-ai">Ausformulieren</button>
          <span id="expand-status" class="suggestion-status" style="margin-left:8px;"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Zeichnung</label>
        <div id="drawing-panel">
          <div class="drawing-toolbar">
            <button type="button" class="draw-tool-btn" data-tool="select" title="Auswählen">↖</button>
            <button type="button" class="draw-tool-btn" data-tool="pen" title="Stift">✎</button>
            <button type="button" class="draw-tool-btn" data-tool="text" title="Textfeld">T</button>
            <button type="button" class="draw-tool-btn" data-tool="rect" title="Rechteck">▭</button>
            <button type="button" class="draw-tool-btn" data-tool="arrow" title="Pfeil">↗</button>
            <button type="button" class="draw-tool-btn" data-tool="eraser" title="Radierer">⌫</button>
            <button type="button" class="draw-tool-btn" data-tool="pan" title="Verschieben (Hand)">✋</button>
            <input type="color" id="draw-color" value="#1c1b1f" title="Farbe"/>
            <input type="range" id="draw-width" min="1" max="20" value="3" title="Strichstärke"/>
            <button type="button" id="draw-reset-view" class="btn-cancel">Ansicht zurücksetzen</button>
            <button type="button" id="draw-clear" class="btn-cancel">Alles löschen</button>
            <button type="button" id="draw-fullscreen" class="btn-cancel" title="Vollbild">⛶</button>
          </div>
          <div id="drawing-canvas-wrap">
            <canvas id="drawing-canvas" width="700" height="450"></canvas>
          </div>
          <p class="drawing-hint">Strg/Cmd + Scrollrad zum Zoomen, „Hand“-Werkzeug zum Verschieben.</p>
        </div>
        <input type="hidden" id="drawing-input" name="drawing"
               th:value="${note.drawing}"/>
        <input type="hidden" id="drawing-data-input" name="drawingData"
               th:value="${note.drawingData}"/>
      </div>

      <!-- Tags -->
      <div class="form-group">
        <label>Tags</label>
        <!-- Vorhandene Tags als Checkboxen -->
        <div class="tag-selector" th:if="${not #lists.isEmpty(allTags)}">
          <th:block th:each="tag : ${allTags}">
            <input type="checkbox" th:id="'tag-' + ${tag.id}" name="tagNames"
                   th:value="${tag.name}" class="tag-checkbox"
                   th:checked="${tagNames != null and tagNames.contains(tag.name)}"/>
            <label th:for="'tag-' + ${tag.id}" class="tag-label" th:text="${tag.name}"></label>
          </th:block>
        </div>
        <!-- Neuen Tag manuell hinzufügen -->
        <div class="new-tag-row">
          <input type="text" id="new-tag-input" placeholder="Neuen Tag eingeben…" autocomplete="off"/>
          <button type="button" id="add-tag-btn" class="btn-add-tag">+</button>
        </div>
        <div id="inline-tags" class="tag-selector" style="margin-top:8px;"></div>

        <!-- KI-Tag-Vorschläge -->
        <div style="margin-top:12px;">
          <button type="button" id="suggest-tags-btn" class="btn btn-ai">KI-Vorschläge laden</button>
          <span id="suggest-status" class="suggestion-status" style="margin-left:8px;"></span>
          <div id="ai-suggestions" class="suggestions-chips" style="margin-top:8px;"></div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/fabric@7.4.0/dist/index.min.js"></script>
      <script>
        const fCanvas = new fabric.Canvas('drawing-canvas', { selection: true });
        const colorInput = document.getElementById('draw-color');
        const widthInput = document.getElementById('draw-width');
        let tool = 'select';
        let panning = false, lastPos = null;
        let shapeStart = null, shapeInProgress = null;

        function applyToolState() {
          fCanvas.isDrawingMode = tool === 'pen';
          fCanvas.selection = tool === 'select';
          fCanvas.defaultCursor = tool === 'pan' ? 'grab' : 'default';
          fCanvas.getObjects().forEach(o => o.selectable = tool === 'select');
          if (fCanvas.isDrawingMode) {
            fCanvas.freeDrawingBrush = new fabric.PencilBrush(fCanvas);
            fCanvas.freeDrawingBrush.color = colorInput.value;
            fCanvas.freeDrawingBrush.width = Number(widthInput.value);
          }
        }

        document.querySelectorAll('.draw-tool-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.draw-tool-btn').forEach(b => b.classList.remove('draw-tool-btn--active'));
            btn.classList.add('draw-tool-btn--active');
            tool = btn.dataset.tool;
            applyToolState();
          });
        });
        document.querySelector('[data-tool="select"]').classList.add('draw-tool-btn--active');

        function addArrow(x1, y1, x2, y2) {
          const angle = Math.atan2(y2 - y1, x2 - x1);
          const headLen = 12;
          const line = new fabric.Line([x1, y1, x2, y2], {
            stroke: colorInput.value, strokeWidth: Number(widthInput.value)
          });
          const head = new fabric.Triangle({
            left: x2, top: y2, originX: 'center', originY: 'center',
            width: headLen, height: headLen,
            angle: (angle * 180 / Math.PI) + 90,
            fill: colorInput.value
          });
          return new fabric.Group([line, head], { selectable: tool === 'select' });
        }

        fCanvas.on('mouse:down', opt => {
          const p = fCanvas.getScenePoint(opt.e);
          if (tool === 'pan') {
            panning = true;
            lastPos = { x: opt.e.clientX, y: opt.e.clientY };
            return;
          }
          if (tool === 'text') {
            const box = new fabric.Textbox('Text', { left: p.x, top: p.y, originX: 'left', originY: 'top', fill: colorInput.value, fontSize: 20, width: 160 });
            fCanvas.add(box);
            fCanvas.setActiveObject(box);
            box.enterEditing();
            box.selectAll();
            return;
          }
          // ponytail: whole-object eraser (deletes strokes/shapes it touches), not pixel eraser;
          // upgrade to @erase2d/fabric if partial-stroke erasing is needed
          if (tool === 'eraser') {
            const target = fCanvas.findTarget(opt.e)?.target;
            if (target) fCanvas.remove(target);
            return;
          }
          if (tool === 'rect' || tool === 'arrow') {
            shapeStart = p;
            if (tool === 'rect') {
              shapeInProgress = new fabric.Rect({
                left: p.x, top: p.y, originX: 'left', originY: 'top', width: 1, height: 1,
                fill: 'transparent', stroke: colorInput.value, strokeWidth: Number(widthInput.value),
                selectable: false
              });
              fCanvas.add(shapeInProgress);
            }
          }
        });

        fCanvas.on('mouse:move', opt => {
          if (tool === 'pan' && panning) {
            const dx = opt.e.clientX - lastPos.x;
            const dy = opt.e.clientY - lastPos.y;
            fCanvas.relativePan({ x: dx, y: dy });
            lastPos = { x: opt.e.clientX, y: opt.e.clientY };
            return;
          }
          if (tool === 'eraser' && opt.e.buttons === 1) {
            const target = fCanvas.findTarget(opt.e)?.target;
            if (target) fCanvas.remove(target);
            return;
          }
          if (tool === 'rect' && shapeStart && shapeInProgress) {
            const p = fCanvas.getScenePoint(opt.e);
            shapeInProgress.set({
              left: Math.min(shapeStart.x, p.x), top: Math.min(shapeStart.y, p.y),
              width: Math.abs(p.x - shapeStart.x), height: Math.abs(p.y - shapeStart.y)
            });
            fCanvas.requestRenderAll();
          }
        });

        fCanvas.on('mouse:up', opt => {
          if (tool === 'pan') { panning = false; return; }
          if (tool === 'arrow' && shapeStart) {
            const p = fCanvas.getScenePoint(opt.e);
            fCanvas.add(addArrow(shapeStart.x, shapeStart.y, p.x, p.y));
          }
          shapeStart = null;
          shapeInProgress = null;
        });

        // Only zoom on Ctrl/Cmd+wheel so a normal scroll gesture over the canvas
        // still scrolls the page instead of hijacking it into a zoom.
        fCanvas.on('mouse:wheel', opt => {
          if (!opt.e.ctrlKey && !opt.e.metaKey) return;
          const zoom = Math.min(5, Math.max(0.2, fCanvas.getZoom() * (0.999 ** opt.e.deltaY)));
          fCanvas.zoomToPoint(new fabric.Point(opt.e.offsetX, opt.e.offsetY), zoom);
          opt.e.preventDefault();
          opt.e.stopPropagation();
        });

        colorInput.addEventListener('change', () => { if (fCanvas.isDrawingMode) applyToolState(); });
        widthInput.addEventListener('change', () => { if (fCanvas.isDrawingMode) applyToolState(); });

        document.getElementById('draw-clear').addEventListener('click', () => fCanvas.clear());
        document.getElementById('draw-reset-view').addEventListener('click', () => fCanvas.setViewportTransform([1, 0, 0, 1, 0, 0]));

        const drawingPanel = document.getElementById('drawing-panel');
        const drawingToolbar = document.querySelector('.drawing-toolbar');
        const drawingHint = document.querySelector('.drawing-hint');
        const ORIGINAL_CANVAS_SIZE = { width: 700, height: 450 };

        document.getElementById('draw-fullscreen').addEventListener('click', () => {
          try {
            const action = document.fullscreenElement === drawingPanel
              ? document.exitFullscreen()
              : drawingPanel.requestFullscreen();
            action.catch(() => {});
          } catch (e) { /* fullscreen unsupported or denied; no-op */ }
        });

        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement === drawingPanel) {
            fCanvas.setDimensions({
              width: window.innerWidth,
              height: window.innerHeight - drawingToolbar.offsetHeight - drawingHint.offsetHeight - 16
            });
          } else {
            fCanvas.setDimensions(ORIGINAL_CANVAS_SIZE);
          }
          fCanvas.requestRenderAll();
        });

        const existingDrawingData = document.getElementById('drawing-data-input').value;
        if (existingDrawingData) {
          fCanvas.loadFromJSON(JSON.parse(existingDrawingData)).then(() => fCanvas.requestRenderAll());
        }

        document.querySelector('form').addEventListener('submit', () => {
          document.getElementById('drawing-data-input').value = JSON.stringify(fCanvas.toJSON());
          if (fCanvas.getObjects().length === 0) {
            document.getElementById('drawing-input').value = '';
            return;
          }
          const savedTransform = fCanvas.viewportTransform.slice();
          fCanvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
          const box = fCanvas.getObjects().reduce((acc, o) => {
            const r = o.getBoundingRect();
            return {
              left: Math.min(acc.left, r.left), top: Math.min(acc.top, r.top),
              right: Math.max(acc.right, r.left + r.width), bottom: Math.max(acc.bottom, r.top + r.height)
            };
          }, { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity });
          document.getElementById('drawing-input').value = fCanvas.toDataURL({
            format: 'png',
            left: box.left - 10, top: box.top - 10,
            width: (box.right - box.left) + 20, height: (box.bottom - box.top) + 20
          });
          fCanvas.setViewportTransform(savedTransform);
        });

        const input = document.getElementById('new-tag-input');
        const addBtn = document.getElementById('add-tag-btn');
        const inlineTags = document.getElementById('inline-tags');

        function addInlineTag(name) {
          const id = 'inline-' + name;
          if (document.getElementById(id)) return;
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.name = 'tagNames'; cb.value = name;
          cb.id = id; cb.className = 'tag-checkbox'; cb.checked = true;
          const lbl = document.createElement('label');
          lbl.htmlFor = id; lbl.className = 'tag-label'; lbl.textContent = name;
          inlineTags.appendChild(cb);
          inlineTags.appendChild(lbl);
        }

        function addTag() {
          const name = input.value.trim().toLowerCase();
          if (!name) return;
          addInlineTag(name);
          input.value = '';
        }
        addBtn.addEventListener('click', addTag);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTag(); } });

        const expandBtn = document.getElementById('expand-btn');
        const expandStatus = document.getElementById('expand-status');

        expandBtn.addEventListener('click', async () => {
          const title = document.getElementById('title').value.trim();
          const content = document.getElementById('content').value.trim();
          if (!title) { expandStatus.textContent = 'Bitte zuerst einen Titel eingeben.'; return; }

          expandBtn.disabled = true;
          expandStatus.textContent = 'KI formuliert aus…';

          try {
            const resp = await fetch('/notes/expand-content', {
              method: 'POST',
              headers: {'Content-Type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({title, content})
            });
            if (resp.status === 503) { expandStatus.textContent = 'Ollama ist nicht erreichbar.'; return; }
            if (!resp.ok) { expandStatus.textContent = 'Fehler beim Ausformulieren.'; return; }
            const expanded = await resp.json();
            document.getElementById('content').value = expanded;
            expandStatus.textContent = 'Fertig.';
          } catch (e) {
            expandStatus.textContent = 'Ollama nicht erreichbar.';
          } finally {
            expandBtn.disabled = false;
          }
        });

        const suggestBtn = document.getElementById('suggest-tags-btn');
        const suggestStatus = document.getElementById('suggest-status');
        const aiSuggestions = document.getElementById('ai-suggestions');

        suggestBtn.addEventListener('click', async () => {
          const title = document.getElementById('title').value.trim();
          const content = document.getElementById('content').value.trim();
          if (!title) { suggestStatus.textContent = 'Bitte zuerst einen Titel eingeben.'; return; }

          suggestBtn.disabled = true;
          suggestStatus.textContent = 'KI analysiert…';
          aiSuggestions.innerHTML = '';

          try {
            const resp = await fetch('/notes/suggest-tags', {
              method: 'POST',
              headers: {'Content-Type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({title, content})
            });
            if (resp.status === 503) { suggestStatus.textContent = 'Ollama ist nicht erreichbar.'; return; }
            if (!resp.ok) { suggestStatus.textContent = 'Fehler beim Abrufen der Vorschläge.'; return; }
            const tags = await resp.json();
            suggestStatus.textContent = tags.length === 0 ? 'Keine Vorschläge gefunden.' : 'Klick auf einen Tag, um ihn hinzuzufügen:';
            tags.forEach(tag => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = tag;
              btn.className = 'tag-suggestion-chip';
              btn.addEventListener('click', () => {
                btn.disabled = true;
                btn.classList.add('tag-suggestion-chip--added');
                addInlineTag(tag);
              });
              aiSuggestions.appendChild(btn);
            });
          } catch (e) {
            suggestStatus.textContent = 'Ollama nicht erreichbar.';
          } finally {
            suggestBtn.disabled = false;
          }
        });
      </script>

      <div class="form-actions">
        <a href="/notes" class="btn-cancel">Abbrechen</a>
        <button type="submit" class="btn-primary"
                th:text="${note.id == null} ? 'Erstellen' : 'Speichern'"></button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
