name: CI

env:
  HELPER_LIBS: spring-boot-utils,mcp-utils

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
      modules: ${{ steps.detect.outputs.modules }}
      image_modules: ${{ steps.detect.outputs.image_modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: detect
        name: Detect changed modules
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable diff base ($BASE) — falling back to a full build."
            echo "no-diff-base" | bash .github/scripts/detect-changed-modules.sh >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "${{ github.sha }}" | bash .github/scripts/detect-changed-modules.sh >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Spotless Check and Verify
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            mvn -B spotless:check
            mvn -B verify
          elif [ -n "${{ needs.changes.outputs.modules }}" ]; then
            mvn -B -pl "${{ needs.changes.outputs.modules }}" -am -amd spotless:check
            mvn -B -pl "${{ needs.changes.outputs.modules }}" -am -amd verify
          else
            echo "No affected modules — skipping build."
          fi

  build-images:
    needs: [changes, build-and-test]
    if: needs.changes.outputs.image_modules != '[]'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.image_modules) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: downcase REPO and MODULE
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
          echo "MODULE=${{ matrix.module }}" >>${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Check for a module-specific Dockerfile
        # Modules that need real CLIs (git, mvn) at runtime, not just a JVM, can't use the
        # buildpack-based native-image build below - they ship a plain Dockerfile instead.
        run: |
          if [ -f "${{ matrix.module }}/Dockerfile" ]; then
            echo "HAS_DOCKERFILE=true" >>"$GITHUB_ENV"
          else
            echo "HAS_DOCKERFILE=false" >>"$GITHUB_ENV"
          fi

      - name: Build Docker Image
        if: env.HAS_DOCKERFILE == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/${{ env.REPO }}/${{ env.MODULE }}:latest-${{ matrix.arch }}

      - name: Pre-install library modules
        if: env.HAS_DOCKERFILE != 'true'
        # Install common sibling modules to the runner's local Maven repository so
        # the later `spring-boot:build-image` run for the selected module can resolve them
        # without attempting to build them as images. Avoids publishing artifacts.
        run: mvn -B -DskipTests install -pl ${{ env.HELPER_LIBS }} -am

      - name: Build Native Image
        if: env.HAS_DOCKERFILE != 'true'
        # Retries: the buildpack lifecycle downloads its JDK/SBOM dependencies straight
        # from github.com, and matrix legs across modules/arches hit those same URLs
        # within seconds of each other, which can trip GitHub's release-download rate
        # limiting (fails fast, not a slow timeout — hence the retry, not just a longer wait).
        run: |
          for attempt in 1 2 3; do
            mvn -pl ${{ matrix.module }} -Pnative spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/${REPO}/${MODULE}:latest-${{ matrix.arch }} -Dspring-boot.build-image.publish=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }} -Dspring-boot.build-image.buildCache=cache -Dspring-boot.build-image.env.BP_RESPONSE_HEADER_TIMEOUT=30 && break
            [ "$attempt" = 3 ] && exit 1
            echo "Build attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

  create-manifest:
    needs: [changes, build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.image_modules) }}
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: downcase REPO
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Create and Push Multi-Architecture Manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${REPO}/${{ matrix.module }}:latest \
            ghcr.io/${REPO}/${{ matrix.module }}:latest-amd64 \
            ghcr.io/${REPO}/${{ matrix.module }}:latest-arm64
